name: Integration

# Runs real package manager installs to verify end-to-end behavior.
# Triggered on pushes to main and manually — not on every PR (installs are slow).
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ── Nix (Linux) ─────────────────────────────────────────────────────────────
  nix-linux:
    name: Smoke test · Nix (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: nix-linux

      - uses: cachix/install-nix-action@ba0dd844c9180cbf77aa72a116d6fbc515d0e87b # v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Build devy
        run: cargo build --release --locked

      - name: Smoke test — install jq via Nix, check, verify
        run: |
          set -euo pipefail
          TMPDIR=$(mktemp -d)
          trap 'rm -rf "$TMPDIR"' EXIT
          cd "$TMPDIR"
          git init -q

          cat > devy.yml <<'EOF'
          name: smoke-nix
          package_manager: nix
          dependencies:
            - jq
          EOF

          "$OLDPWD/target/release/devy" up
          "$OLDPWD/target/release/devy" check

          # Verify the package landed in the project-local Nix profile.
          test -x .devy/nix-profile/bin/jq
          .devy/nix-profile/bin/jq --version

      - name: Doctor — failed up is recorded, diagnosed offline and cleared by a fixed up
        run: .github/scripts/doctor-e2e.sh "$GITHUB_WORKSPACE/target/release/devy"

      # systemd --user needs a user manager; lingering starts one for the runner user.
      - name: Enable systemd user session
        run: |
          sudo loginctl enable-linger "$USER"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          for _ in $(seq 1 20); do
            [ -S "/run/user/$(id -u)/bus" ] && break
            sleep 0.5
          done

      - name: Services — redis and postgresql via Nix listen on their assigned ports
        run: |
          set -euo pipefail
          WORK=$(mktemp -d)
          cd "$WORK"
          git init -q

          cat > devy.yml <<'EOF'
          name: smoke-nix-services
          package_manager: nix
          dependencies:
            - redis
            - postgresql
          EOF

          DEVY="$GITHUB_WORKSPACE/target/release/devy"
          cleanup() {
            "$DEVY" down || true
            for f in "${TMPDIR:-/tmp}"/devy-*.log; do [ -f "$f" ] && { echo "== $f"; tail -50 "$f"; }; done
            journalctl --user --no-pager -n 100 -u "devy-*" || true
            rm -rf "$WORK"
          }
          trap cleanup EXIT

          "$DEVY" up
          "$DEVY" check

          # Ports come from devy.lock (the shadowenv environment isn't active here).
          lock_port() {
            awk -v dep="  $1:" '$0 == dep {f=1; next} /^  [^ ]/ {f=0} f && /assigned_port:/ {print $2}' devy.lock
          }
          REDIS_PORT=$(lock_port redis)
          POSTGRESQL_PORT=$(lock_port postgresql)
          echo "redis=$REDIS_PORT postgresql=$POSTGRESQL_PORT"
          test -n "$REDIS_PORT" && test -n "$POSTGRESQL_PORT"

          .devy/nix-profile/bin/redis-cli -p "$REDIS_PORT" ping | grep -q PONG
          .devy/nix-profile/bin/pg_isready -h 127.0.0.1 -p "$POSTGRESQL_PORT"
          test -f .devy/data/postgresql/PG_VERSION

  # ── Nix (macOS) ─────────────────────────────────────────────────────────────
  nix-macos:
    name: Smoke test · Nix (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: nix-macos

      # cachix/install-nix-action fails on macOS when _nixbld users already
      # exist (eDSRecordAlreadyExists). The Determinate Systems action uses an
      # installer that handles pre-existing users and partial installations
      # gracefully, making it the reliable choice for macOS CI runners.
      - uses: DeterminateSystems/nix-installer-action@65d7c888b2778e8cf30a07a88422ccb23499bfb8 # v4
      - name: Build devy
        run: cargo build --release --locked

      - name: Smoke test — install jq via Nix, check, verify
        run: |
          set -euo pipefail
          TMPDIR=$(mktemp -d)
          trap 'rm -rf "$TMPDIR"' EXIT
          cd "$TMPDIR"
          git init -q

          cat > devy.yml <<'EOF'
          name: smoke-nix-macos
          package_manager: nix
          dependencies:
            - jq
          EOF

          "$OLDPWD/target/release/devy" up
          "$OLDPWD/target/release/devy" check

          test -x .devy/nix-profile/bin/jq
          .devy/nix-profile/bin/jq --version

      - name: Doctor — failed up is recorded, diagnosed offline and cleared by a fixed up
        run: .github/scripts/doctor-e2e.sh "$GITHUB_WORKSPACE/target/release/devy"

      - name: Services — redis and postgresql via Nix listen on their assigned ports
        run: |
          set -euo pipefail
          WORK=$(mktemp -d)
          cd "$WORK"
          git init -q

          cat > devy.yml <<'EOF'
          name: smoke-nix-services
          package_manager: nix
          dependencies:
            - redis
            - postgresql
          EOF

          DEVY="$GITHUB_WORKSPACE/target/release/devy"
          cleanup() {
            "$DEVY" down || true
            for f in "${TMPDIR:-/tmp}"/devy-*.log; do [ -f "$f" ] && { echo "== $f"; tail -50 "$f"; }; done
            rm -rf "$WORK"
          }
          trap cleanup EXIT

          "$DEVY" up
          "$DEVY" check

          # Ports come from devy.lock (the shadowenv environment isn't active here).
          lock_port() {
            awk -v dep="  $1:" '$0 == dep {f=1; next} /^  [^ ]/ {f=0} f && /assigned_port:/ {print $2}' devy.lock
          }
          REDIS_PORT=$(lock_port redis)
          POSTGRESQL_PORT=$(lock_port postgresql)
          echo "redis=$REDIS_PORT postgresql=$POSTGRESQL_PORT"
          test -n "$REDIS_PORT" && test -n "$POSTGRESQL_PORT"

          .devy/nix-profile/bin/redis-cli -p "$REDIS_PORT" ping | grep -q PONG
          .devy/nix-profile/bin/pg_isready -h 127.0.0.1 -p "$POSTGRESQL_PORT"
          test -f .devy/data/postgresql/PG_VERSION

  # ── Homebrew (macOS) ─────────────────────────────────────────────────────────
  brew-macos:
    name: Smoke test · Homebrew (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: brew-macos

      - name: Build devy
        run: cargo build --release --locked

      - name: Smoke test — install jq via Homebrew, check, verify
        run: |
          set -euo pipefail
          TMPDIR=$(mktemp -d)
          trap 'rm -rf "$TMPDIR"' EXIT
          cd "$TMPDIR"
          git init -q

          cat > devy.yml <<'EOF'
          name: smoke-brew
          package_manager: brew
          dependencies:
            - jq
          EOF

          "$OLDPWD/target/release/devy" up
          "$OLDPWD/target/release/devy" check

          brew list jq
          jq --version

  # ── Apt (Linux) ─────────────────────────────────────────────────────────────
  apt-linux:
    name: Smoke test · Apt (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: apt-linux

      - name: Build devy
        run: cargo build --release --locked

      - name: Smoke test — install jq via Apt, check, verify
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          TMPDIR=$(mktemp -d)
          trap 'rm -rf "$TMPDIR"' EXIT
          cd "$TMPDIR"
          git init -q

          cat > devy.yml <<'EOF'
          name: smoke-apt
          package_manager: apt
          dependencies:
            - jq
          EOF

          "$OLDPWD/target/release/devy" up
          "$OLDPWD/target/release/devy" check

          which jq
          jq --version

  # ── Docker services (Linux) ─────────────────────────────────────────────────
  docker-linux:
    name: Smoke test · Docker services (Linux)
    runs-on: ubuntu-latest  # Docker is preinstalled
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: docker-linux

      - name: Build devy
        run: cargo build --release --locked

      # With shadowenv already on PATH, a docker-only project needs nothing from apt.
      - name: Install shadowenv and host clients
        env:
          DEBIAN_FRONTEND: noninteractive
          SHADOWENV_VERSION: 3.5.1
          SHADOWENV_SHA256: 612e10af532b2469715a32d706fd65b03bcc59d6f69724a45a1d292e27df04b8
        run: |
          # shadowenv isn't on crates.io; use the pinned prebuilt release binary.
          curl -fsSL -o shadowenv \
            "https://github.com/Shopify/shadowenv/releases/download/${SHADOWENV_VERSION}/shadowenv-x86_64-unknown-linux-gnu"
          echo "${SHADOWENV_SHA256}  shadowenv" | sha256sum -c -
          sudo install -m 0755 shadowenv /usr/local/bin/shadowenv
          rm shadowenv
          shadowenv --version
          sudo apt-get update -q
          sudo apt-get install -y -q redis-tools postgresql-client

      - name: Services — redis and postgresql as containers on their assigned ports
        run: |
          set -euo pipefail
          WORK=$(mktemp -d)
          cd "$WORK"
          git init -q

          cat > devy.yml <<'EOF'
          name: smoke-docker
          package_manager: apt
          service_manager: docker
          dependencies:
            - redis
            - postgresql
          EOF

          DEVY="$GITHUB_WORKSPACE/target/release/devy"
          cleanup() {
            docker ps -a --filter "label=sh.devy.project=$WORK" || true
            for c in $(docker ps -aq --filter "label=sh.devy.project=$WORK"); do
              echo "== logs $c"; docker logs --tail 50 "$c" || true
            done
            "$DEVY" down --volumes || true
            rm -rf "$WORK"
          }
          trap cleanup EXIT

          "$DEVY" up
          cat devy.lock
          grep -q "source: docker" devy.lock
          grep -q "image_digest: redis@sha256:" devy.lock
          grep -q "image_digest: postgres@sha256:" devy.lock

          # Ports come from devy.lock (the shadowenv environment isn't active here).
          lock_port() {
            awk -v dep="  $1:" '$0 == dep {f=1; next} /^  [^ ]/ {f=0} f && /assigned_port:/ {print $2}' devy.lock
          }
          REDIS_PORT=$(lock_port redis)
          POSTGRESQL_PORT=$(lock_port postgresql)
          echo "redis=$REDIS_PORT postgresql=$POSTGRESQL_PORT"
          test -n "$REDIS_PORT" && test -n "$POSTGRESQL_PORT"

          redis-cli -h 127.0.0.1 -p "$REDIS_PORT" ping | grep -q PONG
          for _ in $(seq 1 30); do
            pg_isready -h 127.0.0.1 -p "$POSTGRESQL_PORT" && break
            sleep 1
          done
          pg_isready -h 127.0.0.1 -p "$POSTGRESQL_PORT"
          # DATABASE_URL names no user: the OS user must exist and need no password.
          psql "postgres://localhost:$POSTGRESQL_PORT/postgres" -c 'select 1'

          "$DEVY" check

          # A second run reuses the locked digests and leaves devy.lock untouched.
          cp devy.lock devy.lock.before
          "$DEVY" up
          cmp devy.lock devy.lock.before

          "$DEVY" down --volumes
          test -z "$(docker ps -aq --filter "label=sh.devy.project=$WORK")"
          test -z "$(docker volume ls -q --filter name=devy-smoke-docker-)"
