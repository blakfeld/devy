name: Integration

# Runs real package manager installs to verify end-to-end behavior.
# Triggered on pushes to main and manually — not on every PR (installs are slow).
on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ── Nix (Linux) ─────────────────────────────────────────────────────────────
  nix-linux:
    name: Smoke test · Nix (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: nix-linux

      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Build devy
        run: cargo build --release

      - name: Smoke test — install jq via Nix, check, verify
        run: |
          set -euo pipefail
          TMPDIR=$(mktemp -d)
          trap 'rm -rf "$TMPDIR"' EXIT
          cd "$TMPDIR"
          git init -q

          cat > devy.yml <<'EOF'
          name: smoke-nix
          package_manager: nix
          dependencies:
            - jq
          EOF

          "$OLDPWD/target/release/devy" up
          "$OLDPWD/target/release/devy" check

          # Verify the package landed in the project-local Nix profile.
          test -x .devy/nix-profile/bin/jq
          .devy/nix-profile/bin/jq --version

      # systemd --user needs a user manager; lingering starts one for the runner user.
      - name: Enable systemd user session
        run: |
          sudo loginctl enable-linger "$USER"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          for _ in $(seq 1 20); do
            [ -S "/run/user/$(id -u)/bus" ] && break
            sleep 0.5
          done

      - name: Services — redis and postgresql via Nix listen on their assigned ports
        run: |
          set -euo pipefail
          WORK=$(mktemp -d)
          cd "$WORK"
          git init -q

          cat > devy.yml <<'EOF'
          name: smoke-nix-services
          package_manager: nix
          dependencies:
            - redis
            - postgresql
          EOF

          DEVY="$GITHUB_WORKSPACE/target/release/devy"
          cleanup() {
            "$DEVY" down || true
            for f in "${TMPDIR:-/tmp}"/devy-*.log; do [ -f "$f" ] && { echo "== $f"; tail -50 "$f"; }; done
            journalctl --user --no-pager -n 100 -u "devy-*" || true
            rm -rf "$WORK"
          }
          trap cleanup EXIT

          "$DEVY" up
          "$DEVY" check

          # Ports come from devy.lock (the shadowenv environment isn't active here).
          lock_port() {
            awk -v dep="  $1:" '$0 == dep {f=1; next} /^  [^ ]/ {f=0} f && /assigned_port:/ {print $2}' devy.lock
          }
          REDIS_PORT=$(lock_port redis)
          POSTGRESQL_PORT=$(lock_port postgresql)
          echo "redis=$REDIS_PORT postgresql=$POSTGRESQL_PORT"
          test -n "$REDIS_PORT" && test -n "$POSTGRESQL_PORT"

          .devy/nix-profile/bin/redis-cli -p "$REDIS_PORT" ping | grep -q PONG
          .devy/nix-profile/bin/pg_isready -h 127.0.0.1 -p "$POSTGRESQL_PORT"
          test -f .devy/data/postgresql/PG_VERSION

  # ── Nix (macOS) ─────────────────────────────────────────────────────────────
  nix-macos:
    name: Smoke test · Nix (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: nix-macos

      # cachix/install-nix-action fails on macOS when _nixbld users already
      # exist (eDSRecordAlreadyExists). The Determinate Systems action uses an
      # installer that handles pre-existing users and partial installations
      # gracefully, making it the reliable choice for macOS CI runners.
      - uses: DeterminateSystems/nix-installer-action@v4
      - name: Build devy
        run: cargo build --release

      - name: Smoke test — install jq via Nix, check, verify
        run: |
          set -euo pipefail
          TMPDIR=$(mktemp -d)
          trap 'rm -rf "$TMPDIR"' EXIT
          cd "$TMPDIR"
          git init -q

          cat > devy.yml <<'EOF'
          name: smoke-nix-macos
          package_manager: nix
          dependencies:
            - jq
          EOF

          "$OLDPWD/target/release/devy" up
          "$OLDPWD/target/release/devy" check

          test -x .devy/nix-profile/bin/jq
          .devy/nix-profile/bin/jq --version

      - name: Services — redis and postgresql via Nix listen on their assigned ports
        run: |
          set -euo pipefail
          WORK=$(mktemp -d)
          cd "$WORK"
          git init -q

          cat > devy.yml <<'EOF'
          name: smoke-nix-services
          package_manager: nix
          dependencies:
            - redis
            - postgresql
          EOF

          DEVY="$GITHUB_WORKSPACE/target/release/devy"
          cleanup() {
            "$DEVY" down || true
            for f in "${TMPDIR:-/tmp}"/devy-*.log; do [ -f "$f" ] && { echo "== $f"; tail -50 "$f"; }; done
            rm -rf "$WORK"
          }
          trap cleanup EXIT

          "$DEVY" up
          "$DEVY" check

          # Ports come from devy.lock (the shadowenv environment isn't active here).
          lock_port() {
            awk -v dep="  $1:" '$0 == dep {f=1; next} /^  [^ ]/ {f=0} f && /assigned_port:/ {print $2}' devy.lock
          }
          REDIS_PORT=$(lock_port redis)
          POSTGRESQL_PORT=$(lock_port postgresql)
          echo "redis=$REDIS_PORT postgresql=$POSTGRESQL_PORT"
          test -n "$REDIS_PORT" && test -n "$POSTGRESQL_PORT"

          .devy/nix-profile/bin/redis-cli -p "$REDIS_PORT" ping | grep -q PONG
          .devy/nix-profile/bin/pg_isready -h 127.0.0.1 -p "$POSTGRESQL_PORT"
          test -f .devy/data/postgresql/PG_VERSION

  # ── Homebrew (macOS) ─────────────────────────────────────────────────────────
  brew-macos:
    name: Smoke test · Homebrew (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: brew-macos

      - name: Build devy
        run: cargo build --release

      - name: Smoke test — install jq via Homebrew, check, verify
        run: |
          set -euo pipefail
          TMPDIR=$(mktemp -d)
          trap 'rm -rf "$TMPDIR"' EXIT
          cd "$TMPDIR"
          git init -q

          cat > devy.yml <<'EOF'
          name: smoke-brew
          package_manager: brew
          dependencies:
            - jq
          EOF

          "$OLDPWD/target/release/devy" up
          "$OLDPWD/target/release/devy" check

          brew list jq
          jq --version

  # ── Apt (Linux) ─────────────────────────────────────────────────────────────
  apt-linux:
    name: Smoke test · Apt (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: apt-linux

      - name: Build devy
        run: cargo build --release

      - name: Smoke test — install jq via Apt, check, verify
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          TMPDIR=$(mktemp -d)
          trap 'rm -rf "$TMPDIR"' EXIT
          cd "$TMPDIR"
          git init -q

          cat > devy.yml <<'EOF'
          name: smoke-apt
          package_manager: apt
          dependencies:
            - jq
          EOF

          "$OLDPWD/target/release/devy" up
          "$OLDPWD/target/release/devy" check

          which jq
          jq --version
