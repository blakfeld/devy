name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # A release is never cut from a commit with a known-vulnerable dependency.
  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-audit
      - run: cargo audit

  build:
    name: Build ${{ matrix.target }}
    needs: audit
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    # Expressions reach scripts only through env, never by interpolation.
    env:
      TARGET: ${{ matrix.target }}
      REF_NAME: ${{ github.ref_name }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      # No rust-cache here: release binaries are built from a cold cache, so a
      # tag build neither saves nor restores a cache entry.

      # A release is never cut from a commit whose tests fail on its own platform.
      # bash on every runner, so "$TARGET" is the env var (pwsh would read it as an
      # undefined PowerShell variable).
      - name: Test
        shell: bash
        run: cargo test --locked --target "$TARGET"

      - name: Build
        shell: bash
        run: cargo build --release --locked --target "$TARGET"

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          tar czf "devy-${REF_NAME}-${TARGET}.tar.gz" \
            -C "target/${TARGET}/release" devy

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "target/$env:TARGET/release/devy.exe" `
            -DestinationPath "devy-$env:REF_NAME-$env:TARGET.zip"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: devy-${{ matrix.target }}
          path: devy-${{ github.ref_name }}-${{ matrix.target }}.*
          if-no-files-found: error

  # Attestation runs in its own job so the OIDC token (id-token: write) is
  # never available to the third-party release action.
  attest:
    name: Checksums and provenance
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA256SUMS
        working-directory: artifacts
        run: |
          set -euo pipefail
          sha256sum devy-* > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: artifacts/SHA256SUMS

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SHA256SUMS
          path: artifacts/SHA256SUMS
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: attest
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Downloads every build archive plus SHA256SUMS from the attest job.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
          merge-multiple: true

      - name: Verify archives against SHA256SUMS
        working-directory: artifacts
        run: sha256sum -c SHA256SUMS

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true

  publish:
    name: Publish to crates.io
    needs: release
    runs-on: ubuntu-latest
    # The `crates-io` environment holds CARGO_REGISTRY_TOKEN as an environment secret
    # and requires a reviewer's approval before this job runs, so a pushed tag alone
    # cannot publish. Create it under Settings > Environments with required reviewers,
    # then move CARGO_REGISTRY_TOKEN from the repository secrets into it. Until the
    # environment exists, GitHub creates it on first use with no protection, so this
    # line alone does not gate publishing. Restricting its deployment tags to `v*` is
    # also recommended.
    environment: crates-io
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
      # cargo reads the token from CARGO_REGISTRY_TOKEN, so it never appears
      # on the command line or in the script text.
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
