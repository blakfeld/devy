schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
context: |
  Project: devy — a declarative developer environment manager CLI (crate `devy`, binary `devy`).
  Tech stack: Rust (edition 2024), clap 4 (derive), serde + serde_yml, anyhow, fs2, ureq, colored.
  Domain: `devy.yml` is the single source of truth (dependencies, services, environment,
  commands, hooks, package_manager); `devy.lock` is generated by `devy up` and committed.
  Platforms: macOS/Linux default to a project-local Nix profile (.devy/nix-profile), with
  brew (macOS) / apt (Linux) opt-in; Windows uses WinGet. Env vars are activated via
  shadowenv (.shadowenv.d/500_devy.lisp).
  Architecture: src/commands/ (one file per subcommand), src/modules/ (one Module trait impl
  per dependency; aliases map to canonical names; unknown names fall back to a generic
  module), src/package_manager/ (nix, brew, apt, winget), src/env_manager/ (shadowenv).
  Testing: unit tests live in each module; tests/cli.rs runs the real binary in a temp dir
  containing a `.git` marker. CI runs cargo test, cargo clippy --all-targets -- -D warnings and
  cargo fmt --check on Linux x86_64/arm64, macOS and Windows.
  Specs: openspec/specs/ describe current user-visible behavior (commands, files written,
  messages, exit codes), not internal Rust types.

