[package]
name = "devy"
version = "0.6.0"
edition = "2024"
description = "A developer environment manager — install dependencies and configure env vars from a single devy.yml"
license = "MIT"
readme = "README.md"
repository = "https://github.com/blakfeld/devy"

[[bin]]
name = "devy"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_norway = "0.9.42"
# Already a serde_norway dependency; used directly for its event parser (src/yaml_safe.rs).
unsafe-libyaml-norway = "0.2.15"
anyhow = "1.0.104"
which = "6"
colored = "3"
ureq = { version = "2", features = ["json", "native-certs"] }
serde_json = "1"
fs2 = "0.4"
ctrlc = "3"
sha2 = "0.11"
tempfile = "3"
regex = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
mutants = "0.0.3"

[package.metadata.mutants]
exclude_globs = ["src/package_manager/**"]
